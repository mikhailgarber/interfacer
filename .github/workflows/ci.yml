name: CI

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify in Dev Container
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            npm ci
            npm run setup:browsers
            npm run verify
